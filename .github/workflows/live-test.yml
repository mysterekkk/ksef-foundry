name: Live TEST (manual)
# Talks ONLY to https://api-test.ksef.mf.gov.pl with synthetic data (random NIP/PESEL, self-signed
# certificate). It needs NO secrets. It is manual on purpose: TEST is a shared environment.
# Never point this at DEMO or PRODUCTION; the test code refuses anything but TEST.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KSEF_LIVE_TEST: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm }
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: dom, libxml, openssl, mbstring, bcmath, curl
          coverage: none
          tools: composer:v2
      - run: npm ci --ignore-scripts
      - run: npm run build -w @luroweb/ksef-foundry
      - name: TypeScript live
        run: npm run test:live -w @luroweb/ksef-foundry
      - name: NestJS live
        run: npm run test:live -w @luroweb/nestjs-ksef-foundry
      - name: PHP live
        working-directory: packages/php
        run: composer update --no-interaction --no-progress --prefer-dist && composer test:live
      - name: Laravel live
        working-directory: packages/laravel
        run: composer update --no-interaction --no-progress --prefer-dist && composer test:live
