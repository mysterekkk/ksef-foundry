name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consistency:
    name: Repo consistency (no network)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22 }
      - run: node scripts/check-consistency.mjs

  php:
    name: PHP ${{ matrix.php }} (SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    defaults:
      run:
        working-directory: packages/php
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, openssl, mbstring, bcmath, curl, json
          coverage: none
          tools: composer:v2
      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: php-${{ matrix.php }}-${{ hashFiles('packages/php/composer.json') }}
          restore-keys: php-${{ matrix.php }}-
      - run: composer validate --strict
      - run: composer update --prefer-dist --no-interaction --no-progress
      - name: cs + phpstan + unit/contract/fault/invoice tests (live excluded)
        run: composer check
      - name: Live tests are NOT run here
        run: echo "Live TEST tests live in the manual 'Live TEST' workflow; they are never reported as passed by this job."

  laravel:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', laravel: '11.*', testbench: '^9.0' }
          - { php: '8.3', laravel: '11.*', testbench: '^9.0' }
          - { php: '8.3', laravel: '12.*', testbench: '^10.0' }
          - { php: '8.4', laravel: '12.*', testbench: '^10.0' }
    defaults:
      run:
        working-directory: packages/laravel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, openssl, mbstring, bcmath, curl, json, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2
      - run: composer validate --strict
      - name: Select Laravel version
        run: composer require --no-update --dev "orchestra/testbench:${{ matrix.testbench }}" && composer require --no-update "illuminate/support:${{ matrix.laravel }}" "illuminate/contracts:${{ matrix.laravel }}" "illuminate/cache:${{ matrix.laravel }}" "illuminate/http:${{ matrix.laravel }}"
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: composer check

  node:
    name: Node ${{ matrix.node }} (TypeScript + NestJS)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build --workspaces --if-present
      - run: npm run typecheck --workspaces --if-present
      - run: npm run lint --workspaces --if-present
      - name: unit + contract + fault-injection + invoice + framework tests (live excluded)
        run: npm test --workspaces --if-present
      - name: Package verification (npm pack + install tarball + import smoke)
        run: npm run verify:pack --workspaces --if-present
      - name: FA(3) build + XSD validation example (offline)
        run: npm run 02:build-validate -w @luroweb/ksef-foundry-example-typescript

  security:
    name: Dependency & secret checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with: { php-version: '8.3', tools: composer:v2, coverage: none }
      - run: npm ci --ignore-scripts
      - name: npm audit (production dependencies, fail on high+)
        run: npm audit --omit=dev --audit-level=high
      - name: composer audit (SDK)
        working-directory: packages/php
        run: composer update --no-interaction --no-progress --prefer-dist && composer audit
      - name: composer audit (Laravel adapter)
        working-directory: packages/laravel
        run: composer update --no-interaction --no-progress --prefer-dist && composer audit
      - name: tracked files must not contain secrets
        run: node scripts/check-consistency.mjs
